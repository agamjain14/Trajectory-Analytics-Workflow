name: Deploy Hybrid (Local pipeline + Vast.ai inference)

# Option 2 — Hybrid:
#   * The FULL analytics pipeline (Spark, Delta, analytics, chat, metrics
#     ingestion) runs on a SELF-HOSTED runner on your local machine, where Delta
#     tables are queryable.
#   * Only LLM inference + GPU/network collectors run on a Vast.ai node. The
#     collectors POST metrics back to this host's /ingest/* endpoints.
#
# Requirements:
#   * A self-hosted GitHub Actions runner on your local machine, labelled
#     `self-hosted` (Docker, Java 17+, Python .venv, Ollama optional).
#   * Secrets: SSH_PRIVATE_KEY (Vast.ai access), optionally VAST_API_KEY.
#   * `ingest_url` must be reachable FROM Vast.ai (LAN IP, Tailscale, or an
#     ngrok/Cloudflare tunnel to this host's :8000).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - teardown
      vast_ip:
        description: 'Vast.ai node public IP (inference + collectors)'
        required: true
        default: '142.126.17.171'
      vast_ssh_port:
        description: 'Vast.ai node SSH port'
        required: true
        default: '43918'
      vast_ollama_url:
        description: 'Ollama URL(s) this host uses to reach Vast.ai (comma-separated for multi-node)'
        required: true
        default: 'http://142.126.17.171:11434'
      ingest_url:
        description: 'URL of THIS host reachable from Vast.ai (collectors POST here, e.g. https://abc.ngrok.app or http://<lan-ip>:8000)'
        required: true
        default: 'http://localhost:8000'
      eval_model:
        description: 'Judge model (runs on Vast.ai via stream_quality). Use llama3.2 for 8GB, qwen2.5:7b for 12GB+'
        required: true
        default: 'qwen2.5:7b'

jobs:
  # ── Local half: full analytics pipeline on the self-hosted runner ──
  local-pipeline:
    name: Start Local Pipeline (self-hosted)
    if: inputs.action == 'deploy'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start hybrid local pipeline
        run: |
          OLLAMA_NODES="${{ inputs.vast_ollama_url }}" \
          EVAL_MODEL="${{ inputs.eval_model }}" \
            bash deploy/hybrid_local.sh start

      - name: Verify pipeline up
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8000/ingest/status >/dev/null 2>&1; then
              echo "=== Ingest status ==="
              curl -s http://localhost:8000/ingest/status
              break
            fi
            echo "  Waiting for app... ($((i*5))s)"
            sleep 5
          done
          bash deploy/hybrid_local.sh status

  # ── Vast.ai half: inference + collectors pushing to this host ──
  vastai-inference:
    name: Start Vast.ai Inference + Collectors
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    needs: local-pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ inputs.vast_ssh_port }} ${{ inputs.vast_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy code to Vast.ai
        run: |
          rsync -avz --exclude='.git' --exclude='data/' --exclude='.venv' --exclude='__pycache__' \
            -e "ssh -p ${{ inputs.vast_ssh_port }} -o StrictHostKeyChecking=no" \
            ./ root@${{ inputs.vast_ip }}:/workspace/trajectory/

      - name: Setup Vast.ai (collector role)
        run: |
          ssh -p ${{ inputs.vast_ssh_port }} -o StrictHostKeyChecking=no \
            root@${{ inputs.vast_ip }} bash -s <<'REMOTE'
          set -euo pipefail
          cd /workspace/trajectory

          export ROLE=collector
          export NODE_ID=node-1
          export INGEST_URL=${{ inputs.ingest_url }}
          export EVAL_MODEL=${{ inputs.eval_model }}

          bash deploy/vastai_setup.sh
          REMOTE

      - name: Verify Vast.ai inference + collectors
        run: |
          ssh -p ${{ inputs.vast_ssh_port }} -o StrictHostKeyChecking=no \
            root@${{ inputs.vast_ip }} bash -s <<'VERIFY'
          echo "=== Ollama ==="
          curl -s http://localhost:11434/api/tags | head -c 200
          echo ""
          echo "=== Collectors ==="
          pgrep -a "gpu_collector|network_collector" || echo "No collectors running — check /tmp/*collector.log"
          VERIFY

      - name: Print access info
        run: |
          echo "============================================"
          echo "  HYBRID DEPLOYED"
          echo "============================================"
          echo "  Local pipeline:  http://localhost:8000/static/index.html"
          echo "  Analytics:       http://localhost:8000/static/analytics.html"
          echo "  Ingest status:   http://localhost:8000/ingest/status"
          echo "  Inference node:  ${{ inputs.vast_ollama_url }}"
          echo "  Collectors push: ${{ inputs.ingest_url }}"
          echo "============================================"

  # ── Teardown both halves ──
  teardown-local:
    name: Stop Local Pipeline (self-hosted)
    if: inputs.action == 'teardown'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop hybrid local pipeline
        run: bash deploy/hybrid_local.sh stop

  teardown-vastai:
    name: Stop Vast.ai Inference + Collectors
    if: inputs.action == 'teardown'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Stop Vast.ai processes
        continue-on-error: true
        run: |
          ssh -p ${{ inputs.vast_ssh_port }} -o StrictHostKeyChecking=no \
            root@${{ inputs.vast_ip }} bash -s <<'REMOTE'
          pkill -f gpu_collector || true
          pkill -f network_collector || true
          pkill -f ollama || true
          echo "Vast.ai inference + collectors stopped"
          REMOTE
