name: Deploy GPU Cluster

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - teardown
          - destroy
      node1_ip:
        description: 'Node 1 public IP (deploy/teardown only)'
        required: false
        default: '142.126.17.171'
      node1_ssh_port:
        description: 'Node 1 SSH port (deploy/teardown only)'
        required: false
        default: '43918'
      node2_ip:
        description: 'Node 2 public IP (deploy/teardown only)'
        required: false
        default: '174.116.164.194'
      node2_ssh_port:
        description: 'Node 2 SSH port (deploy/teardown only)'
        required: false
        default: '42248'
      node1_instance_id:
        description: 'Node 1 vast.ai instance ID (destroy only — stops billing)'
        required: false
        default: ''
      node2_instance_id:
        description: 'Node 2 vast.ai instance ID (destroy only — stops billing)'
        required: false
        default: ''

jobs:
  deploy-node2:
    name: Deploy Node 2 (Collector)
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ inputs.node2_ssh_port }} ${{ inputs.node2_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy code to Node 2
        run: |
          rsync -avz --exclude='.git' --exclude='data/' --exclude='.venv' --exclude='__pycache__' \
            -e "ssh -p ${{ inputs.node2_ssh_port }} -o StrictHostKeyChecking=no" \
            ./ root@${{ inputs.node2_ip }}:/workspace/trajectory/

      - name: Setup Node 2
        run: |
          ssh -p ${{ inputs.node2_ssh_port }} -o StrictHostKeyChecking=no \
            root@${{ inputs.node2_ip }} bash -s <<'REMOTE'
          set -euo pipefail
          cd /workspace/trajectory

          export ROLE=collector
          export NODE_ID=node-2
          export PEER_IP=${{ inputs.node1_ip }}
          export INGEST_URL=http://${{ inputs.node1_ip }}:8000

          bash deploy/vastai_setup.sh
          REMOTE

      - name: Verify Node 2
        run: |
          ssh -p ${{ inputs.node2_ssh_port }} -o StrictHostKeyChecking=no \
            root@${{ inputs.node2_ip }} "curl -s http://localhost:11434/api/tags | head -c 200"

  deploy-node1:
    name: Deploy Node 1 (Primary)
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    needs: deploy-node2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ inputs.node1_ssh_port }} ${{ inputs.node1_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy code to Node 1
        run: |
          rsync -avz --exclude='.git' --exclude='data/' --exclude='.venv' --exclude='__pycache__' \
            -e "ssh -p ${{ inputs.node1_ssh_port }} -o StrictHostKeyChecking=no" \
            ./ root@${{ inputs.node1_ip }}:/workspace/trajectory/

      - name: Setup Node 1
        run: |
          ssh -p ${{ inputs.node1_ssh_port }} -o StrictHostKeyChecking=no \
            root@${{ inputs.node1_ip }} bash -s <<'REMOTE'
          set -euo pipefail
          cd /workspace/trajectory

          export ROLE=primary
          export NODE_ID=node-1
          export PEER_IP=${{ inputs.node2_ip }}
          export NODE_2_IP=${{ inputs.node2_ip }}

          bash deploy/vastai_setup.sh
          REMOTE

      - name: Verify cluster
        run: |
          echo "Waiting for app to start (up to 60s)..."
          ssh -p ${{ inputs.node1_ssh_port }} -o StrictHostKeyChecking=no \
            root@${{ inputs.node1_ip }} bash -s <<'VERIFY'
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8000/ingest/status >/dev/null 2>&1; then
              echo "=== App status ==="
              curl -s http://localhost:8000/ingest/status
              break
            fi
            echo "  Waiting for app... ($((i*5))s)"
            sleep 5
          done
          curl -s http://localhost:8000/ingest/status || echo "App not ready after 60s — check /tmp/app.log"
          echo ""
          echo "=== Ollama (local) ==="
          curl -s http://localhost:11434/api/tags | head -c 200
          echo ""
          echo "=== Ollama (Node 2) ==="
          curl -s http://${{ inputs.node2_ip }}:11434/api/tags | head -c 200
          echo ""
          echo "=== Processes ==="
          pgrep -a "uvicorn|gpu_collector|network_collector|stream_" || echo "No processes found"
          echo ""
          echo "=== App log (last 20 lines) ==="
          tail -20 /tmp/app.log 2>/dev/null || echo "No app log found"
          VERIFY

      - name: Print access info
        run: |
          echo "============================================"
          echo "  CLUSTER DEPLOYED"
          echo "============================================"
          echo ""
          echo "  SSH tunnel:"
          echo "    ssh -p ${{ inputs.node1_ssh_port }} -i ~/.ssh/innovation root@${{ inputs.node1_ip }} \\"
          echo "      -L 8000:localhost:8000 -L 16686:localhost:16686 -L 3000:localhost:3000"
          echo ""
          echo "  Chat:      http://localhost:8000/static/index.html"
          echo "  Analytics: http://localhost:8000/static/analytics.html"
          echo "  Jaeger:    http://localhost:16686"
          echo "  Grafana:   http://localhost:3000"
          echo "  Status:    http://localhost:8000/ingest/status"
          echo "============================================"

  teardown:
    name: Teardown Cluster
    if: inputs.action == 'teardown'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Stop Node 1 (Primary)
        continue-on-error: true
        run: |
          echo "Stopping all services on Node 1 (${{ inputs.node1_ip }})..."
          ssh -p ${{ inputs.node1_ssh_port }} -o StrictHostKeyChecking=no \
            root@${{ inputs.node1_ip }} bash -s <<'REMOTE'
          pkill -f uvicorn || true
          pkill -f gpu_collector || true
          pkill -f network_collector || true
          pkill -f stream_ || true
          pkill -f trace_consumer || true
          pkill -f ollama || true
          docker compose -f /workspace/trajectory/docker-compose.yml down 2>/dev/null || true
          rm -rf /workspace/trajectory/data/checkpoints
          echo "Node 1 stopped"
          REMOTE

      - name: Stop Node 2 (Collector)
        continue-on-error: true
        run: |
          echo "Stopping all services on Node 2 (${{ inputs.node2_ip }})..."
          ssh -p ${{ inputs.node2_ssh_port }} -o StrictHostKeyChecking=no \
            root@${{ inputs.node2_ip }} bash -s <<'REMOTE'
          pkill -f gpu_collector || true
          pkill -f network_collector || true
          pkill -f ollama || true
          echo "Node 2 stopped"
          REMOTE

      - name: Confirm teardown
        run: |
          echo "============================================"
          echo "  CLUSTER TORN DOWN"
          echo "============================================"
          echo "  Node 1 (${{ inputs.node1_ip }}): all processes stopped"
          echo "  Node 2 (${{ inputs.node2_ip }}): all processes stopped"
          echo ""
          echo "  Note: Vast.ai instances are STILL RUNNING (billed)."
          echo "  To stop billing, re-run this workflow with action=destroy"
          echo "  and provide the two vast.ai instance IDs."
          echo "============================================"

  destroy:
    name: Destroy Vast.ai Instances (stops billing)
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.node1_instance_id }}" ] && [ -z "${{ inputs.node2_instance_id }}" ]; then
            echo "::error::Provide at least one of node1_instance_id / node2_instance_id to destroy."
            exit 1
          fi

      - name: Install vast.ai CLI
        run: pip install --quiet vastai

      - name: Destroy Node 1 instance
        if: inputs.node1_instance_id != ''
        continue-on-error: true
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          echo "Destroying Node 1 instance ${{ inputs.node1_instance_id }}..."
          vastai destroy instance ${{ inputs.node1_instance_id }} --api-key "$VAST_API_KEY"

      - name: Destroy Node 2 instance
        if: inputs.node2_instance_id != ''
        continue-on-error: true
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          echo "Destroying Node 2 instance ${{ inputs.node2_instance_id }}..."
          vastai destroy instance ${{ inputs.node2_instance_id }} --api-key "$VAST_API_KEY"

      - name: Verify instances destroyed
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          echo "=== Remaining instances on account ==="
          vastai show instances --api-key "$VAST_API_KEY" || true
          echo ""
          echo "============================================"
          echo "  DESTROY COMPLETE — billing stopped for the"
          echo "  destroyed instances. Confirm none of yours"
          echo "  remain in the list above."
          echo "============================================"
