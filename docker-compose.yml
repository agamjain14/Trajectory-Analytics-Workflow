# Observability Stack for Trajectory Analytics Travel Agent
# Run: docker-compose up -d

version: "3.9"

services:
  # The main application: Chat + Analytics + Live Metrics
  app:
    build:
      context: .
      args:
        DEPLOY_MODE: streaming
    ports:
      - "8000:8000"
    environment:
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PULSAR_URL=${PULSAR_URL:-pulsar://pulsar:6650}
      - DATA_DIR=/app/data
    volumes:
      - app-data:/app/data
    depends_on:
      - otel-collector
      - pulsar
    networks:
      - observability
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OpenTelemetry Collector - receives traces, metrics, logs and routes them
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter
    depends_on:
      - jaeger
      - pulsar
    networks:
      - observability

  # Jaeger - Distributed tracing backend
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "14250:14250"  # Jaeger collector gRPC
    networks:
      - observability

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observability

  # Grafana - Visualization (optional but useful)
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - observability

  # Apache Pulsar - Streaming backbone for trace data
  pulsar:
    image: apachepulsar/pulsar:3.3.0
    command: bin/pulsar standalone
    ports:
      - "6650:6650"   # Pulsar binary protocol
      - "8081:8080"   # Pulsar admin HTTP API (host 8081 to avoid conflict)
    environment:
      - PULSAR_MEM=-Xms512m -Xmx1g
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  grafana-data:
  app-data:
